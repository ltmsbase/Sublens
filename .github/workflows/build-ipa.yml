name: Build unsigned IPA

# 作用：在没有 Xcode 的电脑上，用 GitHub 免费的 macOS 机器把工程编译成 .ipa。
# 产物不带签名，签名交给 Sideloadly / AltStore 用你的免费 Apple ID 在本地完成。

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Xcode
        run: |
          xcodebuild -version
          xcodebuild -showsdks | grep -i iphoneos || true

      - name: Build (no code signing)
        run: |
          set -o pipefail
          xcodebuild \
            -project SubLens.xcodeproj \
            -scheme SubLens \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGN_ENTITLEMENTS="" \
            PROVISIONING_PROFILE_SPECIFIER="" \
            ONLY_ACTIVE_ARCH=NO \
            build | tee build.log | tail -40

      - name: Collect logs on failure
        if: failure()
        run: |
          echo "===== 编译错误摘要 ====="
          grep -n "error:" build.log | head -60 || true
          echo "===== 最后 200 行 ====="
          tail -200 build.log || true

      - name: Package IPA
        run: |
          APP="build/Build/Products/Release-iphoneos/SubLens.app"
          test -d "$APP" || { echo "找不到 $APP"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          # 扩展必须已经嵌进主 App 的 PlugIns 里，否则装上去录屏列表不会出现「译幕」
          test -d "Payload/SubLens.app/PlugIns/ScreenBroadcastExtension.appex" \
            || echo "::warning::扩展没有嵌进主 App，录屏功能会缺失"
          zip -qry SubLens-unsigned.ipa Payload
          ls -lh SubLens-unsigned.ipa

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: SubLens-unsigned-ipa
          path: SubLens-unsigned.ipa
          retention-days: 30
