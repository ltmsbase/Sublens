name: SubLens
options:
  bundleIdPrefix: com.sublens
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    SWIFT_STRICT_CONCURRENCY: minimal
    IPHONEOS_DEPLOYMENT_TARGET: "18.0"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

targets:
  SubLens:
    type: application
    platform: iOS
    sources:
      - path: SubLens
        excludes:
          - "Resources/Info.plist"
          - "Resources/SubLens.entitlements"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sublens.livetranslate
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: SubLens/Resources/Info.plist
        CODE_SIGN_ENTITLEMENTS: SubLens/Resources/SubLens.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_PREVIEWS: YES
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
    dependencies:
      - target: ScreenBroadcastExtension
        embed: true

  ScreenBroadcastExtension:
    type: app-extension
    platform: iOS
    sources:
      - path: ScreenBroadcastExtension
        excludes:
          - "Info.plist"
          - "ScreenBroadcastExtension.entitlements"
      - path: SubLens/Core/SharedBus.swift
      - path: SubLens/Core/BridgeTransport.swift
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.sublens.livetranslate.ScreenBroadcast
        PRODUCT_NAME: "$(TARGET_NAME)"
        INFOPLIST_FILE: ScreenBroadcastExtension/Info.plist
        CODE_SIGN_ENTITLEMENTS: ScreenBroadcastExtension/ScreenBroadcastExtension.entitlements
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: ""
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        APPLICATION_EXTENSION_API_ONLY: YES
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks @executable_path/../../Frameworks"
